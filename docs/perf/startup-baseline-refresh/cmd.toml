# Copy this file to the platform config path described in docs/CONFIG.md.

# Omitted top-level sections use built-in defaults. Within an explicit workspace,
# tab titles, layouts, pane sessions, and split children are required.
# Unknown fields reject the file.

[font]

# Omit family to use the platform-selected monospace font (default).
family = "JetBrainsMono Nerd Font Mono" # Installed monospace family; restart to apply.
size = 16 # Logical pixels; integer from 1 to 256. Runtime shortcuts change size; this is the reset size. Restart to apply edits.

[shell]
program = "C:\\WINDOWS\\system32\\cmd.exe"
args = []

[theme]

# Colors use #RRGGBB.

foreground = "#d8dee9"
background = "#000000"
cursor = "#c8d3f5"

selection_foreground = "#ffffff"
selection_background = "#33415c"

# Exactly 16 ANSI colors, indexes 0 through 15.

ansi = [
    "#1b1d23", "#e06c75", "#98c379", "#e5c07b",
    "#61afef", "#c678dd", "#56b6c2", "#abb2bf",
    "#5c6370", "#e06c75", "#98c379", "#e5c07b",
    "#61afef", "#c678dd", "#56b6c2", "#ffffff",
]

# Optional app UI colors.
# You can override only the values you care about.

ui_background = "#151821"
ui_foreground = "#d8dee9"
ui_selected_background = "#2a3142"
ui_muted = "#727b8e"
ui_accent = "#82aaff"
ui_border = "#353b4a"

# Specific overrides take precedence over semantic UI colors.

search_match_background = "#5a4820"
search_active_background = "#355080"

scrollbar_thumb = "#51596a"
scrollbar_thumb_hover = "#7d879b"


# Binding entries replace the entire default list; keep any shortcuts you want.

# A chord uses optional Ctrl, Shift, Alt, then a physical key.
# Supported keys:
# A-Z, 0-9, PageUp, PageDown, Home, End, Insert, Delete, Backspace, Tab,
# ArrowLeft, ArrowRight, ArrowUp, ArrowDown, Space, Equal, Minus.
# Plain letters and digits require a modifier.

# Commands include:
# copy, paste, page_up, page_down, open_palette, open_tab_picker, open_target,
# new_tab, split_horizontal, split_vertical, next_tab, previous_tab, next_pane,
# previous_pane, focus_pane_left, focus_pane_right, focus_pane_up,
# focus_pane_down, resize_pane_left, resize_pane_right, resize_pane_up,
# resize_pane_down, toggle_pane_zoom, close_pane, rename_tab,
# increase_font_size, decrease_font_size, reset_font_size.

[[bindings]]
key = "Ctrl+Shift+C"
command = "copy"

[[bindings]]
key = "Ctrl+Shift+V"
command = "paste"

[[bindings]]
key = "PageUp"
command = "page_up"

[[bindings]]
key = "PageDown"
command = "page_down"

[[bindings]]
key = "Ctrl+="
command = "increase_font_size"

[[bindings]]
key = "Ctrl++"
command = "increase_font_size"

[[bindings]]
key = "Ctrl+-"
command = "decrease_font_size"

[[bindings]]
key = "Ctrl+0"
command = "reset_font_size"

[[bindings]]
key = "Ctrl+Shift+P"
command = "open_palette"

[[bindings]]
key = "Ctrl+Shift+Space"
command = "open_tab_picker"

[[bindings]]
key = "Ctrl+Shift+T"
command = "new_tab"

[[bindings]]
key = "Ctrl+Shift+E"
command = "split_vertical"

[[bindings]]
key = "Ctrl+Shift+O"
command = "split_horizontal"

[[bindings]]
key = "Ctrl+Tab"
command = "next_tab"

[[bindings]]
key = "Ctrl+Shift+Tab"
command = "previous_tab"

#[[bindings]]
#key = "Ctrl+Shift+ArrowRight"
#command = "next_pane"

#[[bindings]]
#key = "Ctrl+Shift+ArrowLeft"
#command = "previous_pane"

[[bindings]]
key = "Ctrl+Shift+H"
command = "focus_pane_left"

[[bindings]]
key = "Ctrl+Shift+L"
command = "focus_pane_right"

[[bindings]]
key = "Ctrl+Shift+K"
command = "focus_pane_up"

[[bindings]]
key = "Ctrl+Shift+J"
command = "focus_pane_down"

[[bindings]]
key = "Ctrl+Alt+H"
command = "resize_pane_left"

[[bindings]]
key = "Ctrl+Alt+L"
command = "resize_pane_right"

[[bindings]]
key = "Ctrl+Alt+K"
command = "resize_pane_up"

[[bindings]]
key = "Ctrl+Alt+J"
command = "resize_pane_down"

[[bindings]]
key = "Ctrl+Shift+Enter"
command = "toggle_pane_zoom"

[[bindings]]
key = "Ctrl+Shift+Backspace"
command = "close_pane"

[[bindings]]
key = "Ctrl+Shift+N"
command = "rename_tab"

[workspace]

# Default: no project_root.
# Set a path to choose the working directory for panes without a more specific
# tab or pane root. Relative paths resolve from the config file directory.
# Example:
# project_root = "../my-project"

active_tab = 0 # Zero-based index of the initially focused tab.

[[workspace.tabs]]
title = "Terminal 1" # Initial tab title.

# Default: no tab project_root.
# It overrides workspace.project_root.
# Example:
# project_root = "../my-project"

active_pane = 0 # Zero-based initial pane index, in layout leaf order.

[workspace.tabs.layout]
kind = "pane" # "pane" or "split"; a split has axis, first, and second.

# Default: no pane project_root.
# It overrides tab and workspace roots.
# Example:
# project_root = "../my-project"

session = "local_shell" # Required for a pane; or use the command table below.

# To start a command in this pane, replace the session line above with:
#
# [workspace.tabs.layout.session.command]
# program = "cargo" # Executable path or name; no shell interpolation.
# args = ["--version"] # Default: []; arguments passed directly.

# A split layout can be written inline in a tab instead of the layout table:
#
# layout = { kind = "split", axis = "vertical", first = { kind = "pane", session = "local_shell" }, second = { kind = "pane", session = "local_shell" } }
#
# axis accepts "vertical" or "horizontal"; each child can itself be a split.

# Optional project palette entry:
#
# [[projects]]
# name = "My project" # Must be nonempty and unique.
# path = "../my-project" # Nonempty; relative to the config file directory.

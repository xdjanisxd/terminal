name: Release

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-2025, target: x86_64-pc-windows-msvc }
          - { runner: windows-11-vs2026-arm, target: aarch64-pc-windows-msvc }
          - { runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { runner: macos-15-intel, target: x86_64-apple-darwin }
          - { runner: macos-15, target: aarch64-apple-darwin }
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust and components
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update
      - name: Select stable Rust
        run: rustup default stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Verify committed branding assets and metadata
        run: |
          python -m pip install -r scripts/branding-requirements.txt
          python scripts/generate_branding.py --check
          python scripts/test_package_release.py
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check workspace
        run: cargo check --workspace --all-targets
      - name: Run workspace tests (includes native PTY and PowerShell integration tests)
        run: cargo test --workspace --all-targets
      - name: Run doc tests
        run: cargo test --workspace --doc
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  package:
    name: Package ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-2025, target: x86_64-pc-windows-msvc, asset: terminal-windows-x86_64.zip, msi: terminal-windows-x86_64.msi }
          - { runner: windows-11-vs2026-arm, target: aarch64-pc-windows-msvc, asset: terminal-windows-aarch64.zip, msi: terminal-windows-aarch64.msi }
          - { runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu, asset: terminal-linux-x86_64.tar.gz }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, asset: terminal-linux-aarch64.tar.gz }
          - { runner: macos-15-intel, target: x86_64-apple-darwin, asset: terminal-macos-x86_64.tar.gz }
          - { runner: macos-15, target: aarch64-apple-darwin, asset: terminal-macos-aarch64.tar.gz }
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust target
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }} --no-self-update
      - name: Select stable Rust
        run: rustup default stable
      - name: Build release executable
        run: cargo build --locked --release -p terminal-app --bin terminal --target ${{ matrix.target }}
      - name: Inspect Linux shared libraries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ldd "target/${{ matrix.target }}/release/terminal" | tee linux-shared-libraries.txt
          if grep -q 'not found' linux-shared-libraries.txt; then exit 1; fi
      - name: Create archive and smoke-test extracted executable
        run: python scripts/package_release.py ${{ matrix.target }}
      - name: Install .NET for pinned WiX toolchain
        if: runner.os == 'Windows'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and validate MSI using the already-built executable
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TERMINAL_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: ./scripts/build_windows_msi.ps1 -Target '${{ matrix.target }}'
      - name: Upload MSI for inspection
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.msi }}
          path: dist/${{ matrix.msi }}
          if-no-files-found: error
          retention-days: 14
      - name: Smoke-test MSI install, repair, upgrade and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke_windows_msi.ps1 -Msi 'dist/${{ matrix.msi }}' -Target '${{ matrix.target }}'
      - name: Upload MSI diagnostics on failure
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: installer-logs-${{ matrix.target }}
          path: ${{ runner.temp }}/terminal-msi-*.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload portable archive for inspection
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Expected vX.Y.Z tag" >&2; exit 1; }
      - name: Download validated release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: terminal-*
          path: dist
          merge-multiple: true
      - name: Verify the complete release set
        shell: bash
        run: |
          expected=(terminal-windows-x86_64.zip terminal-windows-aarch64.zip terminal-windows-x86_64.msi terminal-windows-aarch64.msi terminal-linux-x86_64.tar.gz terminal-linux-aarch64.tar.gz terminal-macos-x86_64.tar.gz terminal-macos-aarch64.tar.gz)
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq "${#expected[@]}"
          for asset in "${expected[@]}"; do test -s "dist/$asset"; done
      - name: Publish portable archives and Windows installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes

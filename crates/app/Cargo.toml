[package]
name = "terminal-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "terminal"
path = "src/main.rs"

[dependencies]
terminal-config = { path = "../config" }
terminal-core = { path = "../terminal-core" }
terminal-platform = { path = "../platform" }
terminal-pty = { path = "../terminal-pty" }
terminal-renderer = { path = "../renderer" }
terminal-workspace = { path = "../workspace" }
winit = "0.30.13"
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[target.'cfg(target_os = "linux")'.dependencies]
wayland-backend = { version = "0.3", features = ["client_system", "dlopen"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }

[build-dependencies]
winresource = "0.1.30"

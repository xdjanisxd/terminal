[package]
name = "terminal-renderer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bytemuck = { version = "1.23.2", features = ["derive"] }
fontdb = "0.24.0"
pollster = "0.4.0"
swash = "0.2.10"
unicode-width = { version = "0.2.2", default-features = false }
unicode-segmentation = "1.13.3"
terminal-core = { path = "../terminal-core" }
wgpu = "25.0.0"
winit = "0.30.13"

[dev-dependencies]
terminal-workspace = { path = "../workspace" }

[[bench]]
name = "projection_baselines"
harness = false
